# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/steptemplate-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-secret-format
spec:
  bindings:
  - name: namespace
    value: ($namespace)
  # The COSI sidecar writes flat COSI_S3_* keys directly into Secret.data
  # (base64-encoded).  JMESPath assertions confirm all required keys are present
  # without spawning any subprocess or Job.
  try:
  - assert:
      file: resources/credentials-secret-format-assert.yaml
  catch:
  - describe:
      apiVersion: v1
      kind: Secret
      name: ($namespace)

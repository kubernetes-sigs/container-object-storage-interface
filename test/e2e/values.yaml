# Kubernetes namespace in which the sample driver Deployment is expected to
# already exist when this suite runs.
driverNamespace: cosi-driver-sample-system

# Driver name registered by the sample driver binary.
# Matches the X_COSI_DRIVER_NAME default in cosi-driver-sample/cmd/sample-cosi-driver/main.go.
driverName: sample.objectstorage.x-k8s.io

# Deletion policy applied to the BucketClass.
deletionPolicy: Delete

# Image for the sample COSI driver, built and sideloaded by
# `make load.sample-driver` (via `minikube image load`).
sampleDriverImage: localhost:5000/cosi-driver-sample:dev

# Image for the COSI provisioner sidecar, built and sideloaded by
# `make load.sidecar` (via `minikube image load`).
sidecarImage: localhost:5000/cosi-provisioner-sidecar:dev

# Kubernetes namespace in which the sample driver Deployment is created.
driverNamespace: cosi-driver-sample-system

# Driver name registered by the sample driver binary.
# Matches the X_COSI_DRIVER_NAME default in cosi-driver-sample/cmd/sample-cosi-driver/main.go.
driverName: sample.objectstorage.x-k8s.io

# Deletion policy applied to the BucketClass.
deletionPolicy: Delete

# ---------------------------------------------------------------------------
# S3 backend credentials
# TODO: Replace all values below with real rook/ceph credentials once the
#       rook/ceph backend has been configured in the test cluster.
# ---------------------------------------------------------------------------

# S3-compatible endpoint URL (path-style addressing is used by the driver).
# Override via test/e2e/rook-credentials.yaml (generated by 'make deploy-rook').
s3Endpoint: "http://TODO-replace-with-rook-ceph-rgw-endpoint"

# AWS region. AWS SDK v2 rejects empty regions even for non-AWS backends, so
# use a placeholder; RGW (and most S3-compatible backends) ignore it.
s3Region: "us-east-1"

# Admin credentials - placed in the admin Secret read by every BucketClass
# and BucketAccessClass operation.
# Override via test/e2e/rook-credentials.yaml (generated by 'make deploy-rook').
adminAccessKeyId: "TODO-replace-with-real-admin-key-id"
adminSecretAccessKey: "TODO-replace-with-real-admin-secret-key"

# Per-user access credentials - placed in the access Secret returned verbatim
# to the BucketAccess consumer.  The sample driver does not create IAM users;
# these credentials must be pre-provisioned in the backend.
# Override via test/e2e/rook-credentials.yaml (generated by 'make deploy-rook').
accessKeyId: "TODO-replace-with-real-access-key-id"
accessSecretKey: "TODO-replace-with-real-access-secret-key"

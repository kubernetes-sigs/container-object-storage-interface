apiVersion: batch/v1
kind: Job
metadata:
  name: cosi-s3-connectivity
  labels:
    app.kubernetes.io/component: cosi-s3-connectivity-test
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cosi-s3-connectivity-test
    spec:
      restartPolicy: Never
      containers:
      - name: aws-cli
        image: public.ecr.aws/aws-cli/aws-cli:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: ($namespace)
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail

          # COSI secret keys use the env var names aws CLI expects.
          # Fall back to a default region if the driver did not report one.
          export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"

          # For non-AWS S3-compatible backends, path-style addressing
          # must be used. There is no env-var equivalent in aws CLI v2,
          # so configure it explicitly.
          aws configure set default.s3.addressing_style path

          BUCKET="${BUCKET_NAME}"
          OBJECT_KEY="cosi-e2e-probe-$(date +%s)"

          echo "Uploading probe object s3://${BUCKET}/${OBJECT_KEY} ..."
          echo "cosi-e2e-probe" | aws s3 cp - "s3://${BUCKET}/${OBJECT_KEY}"

          echo "Deleting probe object s3://${BUCKET}/${OBJECT_KEY} ..."
          aws s3 rm "s3://${BUCKET}/${OBJECT_KEY}"

          echo "S3 connectivity validation passed."

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference the upstream default overlay from the cosi-driver-sample repo.
# The path is relative to this file: kustomize/ -> ../../../../cosi-driver-sample/config/default
resources:
- ../../../../cosi-driver-sample/config/default

# Runtime image overrides are applied via 'kubectl set image' in deploy-driver.step.yaml
# after 'kustomize build | kubectl apply', so no image overrides are needed here.
# The base images (driver/sidecar stubs) get patched to local registry images at deploy time.

# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/steptemplate-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: validate-s3-connectivity
spec:
  bindings:
  - name: namespace
    value: ($namespace)
  # The Job mounts the credentials Secret as environment variables via envFrom.
  # The COSI sidecar populates the following keys:
  #   COSI_S3_BUCKET_ID        -> bucket name
  #   COSI_S3_ENDPOINT         -> S3 endpoint URL
  #   COSI_S3_REGION           -> region string
  #   COSI_S3_ADDRESSING_STYLE -> "path" or "virtual"
  #   COSI_S3_ACCESS_KEY_ID    -> access key
  #   COSI_S3_ACCESS_SECRET_KEY -> secret key
  try:
  - create:
      file: resources/s3-connectivity-job.yaml
  - assert:
      timeout: 120s
      file: resources/s3-connectivity-job-assert.yaml
  catch:
  - describe:
      apiVersion: batch/v1
      kind: Job
      name: cosi-s3-connectivity
  - podLogs:
      selector: app.kubernetes.io/component=cosi-s3-connectivity-test
      tail: -1

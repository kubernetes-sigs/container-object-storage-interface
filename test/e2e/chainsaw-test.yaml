# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sample-driver-e2e
spec:
  template: true

  # The COSI controller and the sample driver (with its credentials Secrets)
  # are required to be deployed and Ready before this suite runs. The suite
  # itself is purely functional - it does not deploy or configure any
  # cluster components.
  steps:

  # Step 1: Verify the COSI controller is running before proceeding.
  - name: Assert COSI controller is running
    use:
      template: assert-controller-ready.step.yaml

  # Step 2: Verify the sample driver is running before proceeding.
  - name: Assert sample driver is running
    use:
      template: assert-driver-ready.step.yaml

  # Step 3: Create the cluster-scoped BucketClass and BucketAccessClass.
  - name: Create BucketClass and BucketAccessClass
    use:
      template: create-cosi-resources.step.yaml

  # Step 4: Create the ServiceAccount and BucketClaim in the test namespace.
  - name: Create ServiceAccount and BucketClaim
    use:
      template: create-bucket-claim.step.yaml

  # Step 5: Wait for the BucketClaim to reach Ready state.
  - name: Assert BucketClaim is ready
    use:
      template: assert-bucket-provisioned.step.yaml

  # Step 6: Create the BucketAccess to request credentials.
  - name: Create BucketAccess
    use:
      template: create-bucket-access.step.yaml

  # Step 7: Wait for the BucketAccess to be granted and the Secret to appear.
  - name: Assert BucketAccess is granted
    use:
      template: assert-access-granted.step.yaml

  # Step 8: Validate the credentials Secret contains all required COSI_S3_* keys.
  - name: Validate credentials Secret format
    use:
      template: validate-secret-format.step.yaml

  # Step 9: Validate actual S3 connectivity by uploading and deleting a probe object.
  - name: Validate S3 connectivity
    use:
      template: validate-s3-connectivity.step.yaml

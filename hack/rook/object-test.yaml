# Rook/Ceph object store (RGW) and user for local E2E testing.
# Credentials are extracted by hack/setup-rook.sh and written to
# test/e2e/rook-credentials.yaml for use by the Chainsaw test suite.
#
# Derived from rook/deploy/examples/object-test.yaml and object-user.yaml (Rook v1.19.4).
---
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: my-store
  namespace: rook-ceph
spec:
  metadataPool:
    replicated:
      size: 1
  dataPool:
    replicated:
      size: 1
  preservePoolsOnDelete: false
  gateway:
    port: 80
    instances: 1
---
# Object store user with full bucket+user capabilities so the COSI sample
# driver can create and delete buckets via its admin credentials.
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: my-user
  namespace: rook-ceph
spec:
  store: my-store
  displayName: "COSI E2E Test User"
  capabilities:
    user: "*"
    bucket: "*"
